server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/shared/(.+)$ {
        set $is_bot 0;
        if ($http_user_agent ~* "(kakaotalk|slackbot|facebookexternalhit|twitterbot|telegrambot|linkedinbot|discordbot|whatsapp|line|googlebot|bingbot|yandexbot)") {
            set $is_bot 1;
        }
        if ($is_bot = 1) {
            proxy_pass http://backend:8089/api/shared/$1/og;
        }
        if ($is_bot = 0) {
            rewrite ^ /index.html break;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8089/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
