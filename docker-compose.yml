services:
  backend:
    build: ./backend
    container_name: mdnote-backend
    expose:
      - "8089"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/mdnote
      - DATABASE_USERNAME=dbuser
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: mdnote-frontend
    ports:
      - "8089:80"
    depends_on:
      - backend
    restart: unless-stopped
