services:
  backend:
    build: ./backend
    container_name: mdnote-backend
    expose:
      - "8089"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/mdnote
      - DATABASE_USERNAME=dbuser
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://everforest.iptime.org:8089/oauth/callback}
      - TZ=Asia/Seoul
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8089/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  frontend:
    build: ./frontend
    container_name: mdnote-frontend
    environment:
      - TZ=Asia/Seoul
    ports:
      - "8089:80"
    networks:
      - default
      - infra-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # curl 사용: busybox wget이 localhost를 IPv6(::1)로 먼저 해석하고 폴백을 안 해
      # nginx(0.0.0.0:80 listen)에 connection refused가 떨어지는 함정 회피.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
  infra-net:
    external: true
